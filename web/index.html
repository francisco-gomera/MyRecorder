<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyRecorder</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><div class="brand"><span class="dot"></span><div><small>MYRECORDER</small><h1>Lives, guardados.</h1></div></div><span class="local">● LOCAL</span></header>
<section class="hero"><p class="eyebrow">CAPTURA EN VIVO</p><h2>Graba un directo completo.</h2><p class="sub">Pega el enlace de YouTube. La grabación continúa hasta que la detengas.</p><form id="start"><input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required><button id="startBtn">Iniciar grabación <span>↗</span></button></form><div id="notice"></div></section>
<section class="library"><div class="section-head"><div><p class="eyebrow">TU BIBLIOTECA</p><h2>Grabaciones</h2></div><button class="refresh" id="refresh">Actualizar ↻</button></div><div id="list" class="grid"></div></section><footer>Se guarda localmente en tu carpeta de grabaciones · MKV</footer></main><script src="/app.js"></script></body></html>
